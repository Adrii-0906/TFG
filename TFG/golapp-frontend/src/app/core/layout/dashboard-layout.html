<!-- ════════════════════════════════════════════════
     GOLAPP — Dashboard Layout (Sidebar + Content)
     ════════════════════════════════════════════════ -->

<!-- Sidebar Overlay (móvil) -->
@if (!sidebarOpen()) {
  <div class="fixed inset-0 bg-black/50 z-20 lg:hidden" (click)="toggleSidebar()"></div>
}

<div class="flex h-screen overflow-hidden">

  <!-- ── SIDEBAR ────────────────────────────────── -->
  <aside
    class="fixed lg:static inset-y-0 left-0 z-30 flex flex-col w-64 bg-golapp-card border-r border-golapp-border transform transition-transform duration-300 ease-in-out"
    [class.translate-x-0]="sidebarOpen()"
    [class.-translate-x-full]="!sidebarOpen()"
    [class.lg:translate-x-0]="true">

    <!-- Logo -->
    <div class="flex items-center gap-3 px-6 h-16 border-b border-golapp-border">
      <img src="/assets/logo.png" alt="GOLAPP Logo" class="h-8 w-auto">
      <span class="text-xl font-bold tracking-tight">
        <span class="text-golapp-green">GOL</span><span class="text-golapp-text">APP</span>
      </span>
    </div>

    <!-- Navegación -->
    <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
      @for (item of navItems; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="bg-golapp-green/10 text-golapp-green border-golapp-green"
          [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
          class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-golapp-text-muted hover:text-golapp-text hover:bg-golapp-card-hover border-l-2 border-transparent transition-all duration-200">
          <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path [attr.d]="item.iconPath"/>
          </svg>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <!-- Footer del Sidebar -->
    <div class="px-4 py-4 border-t border-golapp-border">
      <div class="flex items-center gap-3 px-2">
        <div class="w-9 h-9 rounded-full bg-golapp-blue/20 flex items-center justify-center">
          <span class="text-sm font-semibold text-golapp-blue">{{ usuario().iniciales }}</span>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-medium text-golapp-text truncate">{{ usuario().nombre }}</p>
          <p class="text-xs text-golapp-text-muted truncate">{{ usuario().rol === 'ORGANIZADOR' ? 'Organizador' : 'Participante' }}</p>
        </div>
        <button
          (click)="logout()"
          title="Cerrar sesión"
          class="p-2 rounded-lg text-golapp-text-muted hover:text-golapp-danger hover:bg-golapp-danger/10 transition-all">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- ── CONTENIDO PRINCIPAL ────────────────────── -->
  <div class="flex-1 flex flex-col min-w-0">

    <!-- Top Bar -->
    <header class="flex items-center justify-between h-16 px-4 lg:px-6 bg-golapp-card border-b border-golapp-border">
      <!-- Botón hamburguesa (móvil) -->
      <button (click)="toggleSidebar()" class="p-2 rounded-lg text-golapp-text-muted hover:text-golapp-text hover:bg-golapp-card-hover lg:hidden">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>

      <!-- Buscador -->
      <div class="hidden sm:flex items-center flex-1 max-w-md ml-4">
        <div class="relative w-full">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-golapp-text-muted" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <input
            type="text"
            placeholder="Buscar torneos, equipos..."
            class="w-full pl-10 pr-4 py-2 rounded-lg bg-golapp-dark border border-golapp-border text-sm text-golapp-text placeholder:text-golapp-text-muted focus:outline-none focus:ring-2 focus:ring-golapp-green/50 focus:border-golapp-green">
        </div>
      </div>

      <!-- Acciones del header -->
      <div class="flex items-center gap-2">
        <!-- Notificaciones -->
        <button class="relative p-2 rounded-lg text-golapp-text-muted hover:text-golapp-text hover:bg-golapp-card-hover">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
          </svg>
          <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-golapp-danger rounded-full"></span>
        </button>
      </div>
    </header>

    <!-- Área de contenido (router-outlet) -->
    <main class="flex-1 overflow-y-auto p-4 lg:p-6">
      <router-outlet />
    </main>
  </div>
</div>
